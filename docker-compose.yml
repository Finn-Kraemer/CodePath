# Secrets kommen aus der Datei .env (Vorlage: .env.example). Ohne sie startet der Stack nicht.
services:
  postgres:
    image: postgres:17
    restart: on-failure
    environment:
      POSTGRES_DB: codepath
      POSTGRES_USER: codepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepath"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nur bei Bedarf: docker compose --profile tools up -d pgadmin
  # Ohne eigenen Login, daher nur auf diesem Rechner erreichbar.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: on-failure
    ports:
      - "127.0.0.1:8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "10"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['internal']"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_DISABLE_LOGIN_BANNER: "True"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure
    ports:
      # Management-UI nur lokal; AMQP (5672) ist nur im Docker-Netz erreichbar
      - "127.0.0.1:15672:15672"
      # Web-MQTT für die Live-Updates im Browser
      - "15675:15675"
    # Legt beim Start den öffentlichen Nur-Lese-Nutzer "codepath-viewer" für den Browser an:
    # er darf eigene Subscription-Queues anlegen und lesen, aber nicht auf amq.topic veröffentlichen.
    command:
      - bash
      - -c
      - |
        rabbitmq-plugins enable --offline rabbitmq_mqtt rabbitmq_web_mqtt
        rabbitmq-server &
        trap 'rabbitmqctl stop' TERM INT
        until rabbitmqctl await_startup >/dev/null 2>&1; do sleep 2; done
        rabbitmqctl add_user codepath-viewer codepath-viewer >/dev/null 2>&1 || true
        rabbitmqctl set_permissions -p / codepath-viewer '^mqtt-subscription-.*' '^mqtt-subscription-.*' '^(amq\.topic|mqtt-subscription-.*)$$'
        wait
    environment:
      RABBITMQ_DEFAULT_USER: codepath
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD in .env setzen}

  backend:
    image: ghcr.io/finn-kraemer/codepath-backend:latest
    restart: on-failure
    ports:
      # Der Browser spricht über das Frontend (nginx) mit der API
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codepath
      SPRING_DATASOURCE_USERNAME: codepath
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: codepath
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD in .env setzen}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET in .env setzen (mindestens 32 Zeichen)}
      # Leer lassen = beim ersten Start wird ein Passwort erzeugt und ins Backend-Log geschrieben
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
      - rabbitmq

  frontend:
    image: ghcr.io/finn-kraemer/codepath-frontend:latest
    restart: on-failure
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
