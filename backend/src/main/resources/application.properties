spring.application.name=codepath
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codepath}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:codepath}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Mehrere Zeilen in einem Rundlauf schreiben (Importe, Kurs-Aktionen); IN-Listen auf Zweierpotenzen
# auffüllen, damit PostgreSQL und Hibernate ihre Abfragepläne wiederverwenden
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Last und Ausfallsicherheit (docs/betrieb.md#last-und-skalierung)
# Virtuelle Threads: Jede Anfrage bekommt einen eigenen, billigen Thread; mehrere Klassen gleichzeitig
# brauchen keinen großen Thread-Pool. Begrenzt wird über den Verbindungspool zur Datenbank.
spring.threads.virtual.enabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
# Lieber nach 10 s eine klare Fehlermeldung als minutenlang hängende Anfragen
spring.datasource.hikari.connection-timeout=10000
# Hält ungenutzte Verbindungen über Firewalls/NAT hinweg am Leben
spring.datasource.hikari.keepalive-time=300000
# Laufende Abgaben beim Update oder Neustart noch fertig bearbeiten
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Antworten komprimieren (JSON, Frontend, Monaco, Pyodide) – spart im Schul-WLAN viel Bandbreite.
# text/event-stream fehlt bewusst: Live-Updates dürfen nicht gepuffert werden.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml,application/wasm
# Ranglisten-Updates höchstens so oft an die Browser eines Kurses (siehe RealtimeUpdateService)
codepath.live.leaderboard-interval=${CODEPATH_LEADERBOARD_INTERVAL:2s}
spring.flyway.enabled=true
spring.flyway.placeholder-replacement=false

# Sessions liegen in PostgreSQL (ADR-3); Tabellen legt Flyway an
spring.session.jdbc.initialize-schema=never
spring.session.timeout=12h
# Session-Cookie (HttpOnly, SameSite=Lax) wird in SessionConfig gebaut; hinter TLS COOKIE_SECURE=true setzen
codepath.session.cookie-secure=${COOKIE_SECURE:false}

# Hinter einem Reverse Proxy (z. B. Caddy) die X-Forwarded-Header auswerten
server.forward-headers-strategy=native

# Leer = beim ersten Start wird ein zufälliges Passwort erzeugt und ins Log geschrieben
admin.seed.username=${ADMIN_SEED_USERNAME:admin}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Logs als JSON: Umgebungsvariable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs setzen

# Gewollt: eigener AuthenticationProvider (ApplicationConfig)
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# OpenAPI-Beschreibung der API (Quelle für die Frontend-Typen); nur für die Lehrkraft abrufbar
springdoc.api-docs.path=/api/admin/openapi
springdoc.writer-with-order-by-keys=true

# Code-Runner (ADR-4, docs/betrieb.md): CODEPATH_RUNNER_URL und CODEPATH_RUNNER_TOKEN setzen,
# sonst sind Code-Aufgaben Übungen ohne Punkte.

# Uploads: Bilder höchstens 2 MB (MediaService), Content-Pakete mit Bildern höchstens 20 MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
