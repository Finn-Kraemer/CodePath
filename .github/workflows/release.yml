name: Release

# Ein Tag vX.Y.Z (oder vX.Y.Z-rc.1) auf einem Commit aus main veröffentlicht eine neue Version:
# CI → Images bauen, signierte Herkunftsnachweise anhängen → GitHub-Release mit Text aus CHANGELOG.md
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

# Nie zwei Releases gleichzeitig, und ein laufendes Release wird nicht abgebrochen
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Tag prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag liegt auf main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Der Tag $GITHUB_REF_NAME zeigt auf einen Commit, der nicht in main ist."
            exit 1
          fi
      - name: Version und Änderungsprotokoll
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            # Vorabversion: kein eigener Abschnitt im Änderungsprotokoll nötig
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          if ! grep -qE "^## \[?${version//./\\.}\]?( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt \"## $version\". Bitte vor dem Taggen ergänzen."
            exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.name }}
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # signierte Herkunftsnachweise (Sigstore)
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ein Image für App und Frontend, z. B. ghcr.io/finn-kraemer/codepath:v2.2.0
          - name: codepath
            context: .
            suffix: ''
          # Optionaler Code-Runner, z. B. ghcr.io/finn-kraemer/codepath-runner:v2.2.0
          - name: codepath-runner
            context: runner
            suffix: '-runner'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bei der Container-Registry anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          # latest nur für stabile Versionen; Vorabversionen bekommen nur ihren eigenen Tag
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
          # v2.2.0 (wie bisher, für CODEPATH_VERSION) sowie 2.2.0, 2.2 und 2
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Herkunftsnachweis signieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub-Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release-Text aus CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Abschnitt "## <Version>" bis zur nächsten Überschrift zweiter Ebene
          awk -v v="$VERSION" '
            /^## / { if (found) exit; h=$0; sub(/^## \[?/, "", h); sub(/\]?([ ].*)?$/, "", h); if (h == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo '### Images'
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}-runner:${GITHUB_REF_NAME}"
            echo '```'
          } >> notes.md
          cat notes.md
      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          title="CodePath $GITHUB_REF_NAME"
          # Wurde der Tag im Browser über "Draft a new release" angelegt, gibt es das Release schon:
          # dann Text, Titel und Status übernehmen statt neu anlegen.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(--title "$title" --notes-file notes.md --draft=false)
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); else args+=(--prerelease=false --latest); fi
            gh release edit "$GITHUB_REF_NAME" "${args[@]}"
          else
            args=(--title "$title" --notes-file notes.md --verify-tag)
            # Vorabversionen: Liste der PRs seit dem letzten Release statt Änderungsprotokoll
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease --generate-notes); else args+=(--latest); fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
