name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Tests gegen PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers startet PostgreSQL über den Docker-Daemon des Runners
      - name: Tests
        run: ./mvnw -B verify
      # OpenApiExportTest schreibt die API-Beschreibung neu; sie muss eingecheckt sein
      - name: API-Beschreibung aktuell
        run: git diff --exit-code ../frontend/src/lib/api/openapi.json

  frontend:
    name: Frontend (Lint, Typcheck, Tests, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Version kommt aus "packageManager" in package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: API-Typen aktuell
        run: pnpm gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - name: Typcheck
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  content:
    name: Content-Pakete prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0
      - name: Schema-Validierung
        run: python content/validate.py

  e2e:
    name: Docker-Image + End-to-End-Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Stack mit frisch gebautem Image starten
        run: |
          printf 'POSTGRES_PASSWORD=ci-postgres\nADMIN_SEED_PASSWORD=ci-admin-passwort\n' > .env
          docker compose up -d --build --wait
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_PASSWORD: ci-admin-passwort
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs app
