<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f172a" />
		<style>
			/* Start-Intro: steht hier statt in einer Komponente, damit es sofort sichtbar ist,
			   noch bevor das JavaScript der App geladen ist. */
			#cp-splash {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				background: #0f172a;
				border-bottom: 6px solid #b45309;
				font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
				text-align: center;
				cursor: pointer;
				transition:
					opacity 0.45s ease,
					visibility 0.45s;
			}
			#cp-splash.cp-out,
			.cp-intro-seen #cp-splash:not(.cp-wait) {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}
			#cp-splash svg {
				width: min(180px, 40vw);
				height: auto;
				overflow: visible;
			}
			#cp-splash .cp-word {
				color: #fff;
				font-size: clamp(36px, 9vw, 64px);
				font-weight: 900;
				letter-spacing: -0.03em;
				line-height: 1;
			}
			#cp-splash .cp-tag {
				margin-top: 12px;
				color: #d97706;
				font-size: clamp(10px, 2.4vw, 14px);
				font-weight: 700;
				letter-spacing: 6px;
				line-height: 1;
				text-align: center;
			}
			#cp-splash .cp-status {
				min-height: 20px;
				color: #cbd5e1;
				font-size: 14px;
				opacity: 0;
				transition: opacity 0.4s ease;
			}
			#cp-splash.cp-wait .cp-status {
				opacity: 1;
			}
			.cp-dot,
			.cp-goal,
			.cp-ring {
				transform-box: fill-box;
				transform-origin: center;
			}
			.cp-line {
				stroke-dasharray: 1;
				animation: cp-line 1.05s 0.25s cubic-bezier(0.65, 0, 0.35, 1) both;
			}
			.cp-dot {
				animation: cp-dot 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
			}
			.cp-goal {
				animation: cp-goal 0.5s 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
			}
			.cp-ring {
				opacity: 0;
				animation: cp-ring 0.8s 1.55s ease-out both;
			}
			.cp-word {
				animation: cp-rise 0.55s 1.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
			}
			.cp-tag {
				animation: cp-spread 0.7s 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
			}
			#cp-splash.cp-wait .cp-goal {
				animation: cp-pulse 1.4s ease-in-out infinite;
			}
			.cp-intro-seen #cp-splash *,
			.cp-intro-seen #cp-splash.cp-wait .cp-ring {
				animation: none;
			}
			.cp-intro-seen #cp-splash.cp-wait .cp-goal {
				animation: cp-pulse 1.4s ease-in-out infinite;
			}
			@keyframes cp-dot {
				0% {
					transform: scale(0);
				}
				60% {
					transform: scale(1.3);
				}
				100% {
					transform: scale(1);
				}
			}
			@keyframes cp-line {
				from {
					stroke-dashoffset: 1;
				}
				to {
					stroke-dashoffset: 0;
				}
			}
			@keyframes cp-goal {
				0% {
					transform: scale(0) rotate(-90deg);
				}
				60% {
					transform: scale(1.35) rotate(0deg);
				}
				100% {
					transform: scale(1) rotate(0deg);
				}
			}
			@keyframes cp-ring {
				0% {
					opacity: 0;
					transform: scale(1);
				}
				1% {
					opacity: 0.9;
					transform: scale(1);
				}
				100% {
					opacity: 0;
					transform: scale(2.4);
				}
			}
			@keyframes cp-rise {
				from {
					opacity: 0;
					transform: translateY(14px);
				}
				to {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes cp-spread {
				from {
					opacity: 0;
					letter-spacing: 2px;
				}
				to {
					opacity: 1;
					letter-spacing: 6px;
				}
			}
			@keyframes cp-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.35;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#cp-splash *,
				#cp-splash.cp-wait .cp-goal {
					animation: none !important;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<div id="cp-splash" role="status" aria-label="CodePath wird gestartet">
			<svg viewBox="0 0 48 48" aria-hidden="true">
				<path
					class="cp-line"
					pathLength="1"
					d="M33 35H14V14h14"
					fill="none"
					stroke="#fff"
					stroke-width="4.5"
				/>
				<circle class="cp-dot" cx="33" cy="35" r="4" fill="#fff" />
				<rect
					class="cp-ring"
					x="28"
					y="10"
					width="8"
					height="8"
					fill="none"
					stroke="#d97706"
					stroke-width="1"
				/>
				<rect class="cp-goal" x="28" y="10" width="8" height="8" fill="#b45309" />
			</svg>
			<div>
				<div class="cp-word">CODEPATH</div>
				<div class="cp-tag">BERUFSORIENTIERUNG IT</div>
			</div>
			<div class="cp-status">Verbindung wird aufgebaut …</div>
		</div>
		<script>
			// Intro einmal pro Sitzung; danach erscheint die Fläche nur, wenn der Start länger dauert.
			(function () {
				var root = document.documentElement;
				var splash = document.getElementById('cp-splash');
				var seen = false;
				try {
					seen = sessionStorage.getItem('cp-intro') === '1';
					sessionStorage.setItem('cp-intro', '1');
				} catch (e) {}
				var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				if (seen) root.classList.add('cp-intro-seen');
				var start = Date.now();
				var minTime = seen ? 0 : reduced ? 700 : 2900;
				var ready = false;
				var gone = false;
				function hide() {
					if (gone) return;
					gone = true;
					splash.classList.add('cp-out');
					setTimeout(function () {
						splash.remove();
					}, 500);
				}
				window.cpSplashDone = function () {
					if (ready) return;
					ready = true;
					setTimeout(hide, Math.max(0, minTime - (Date.now() - start)));
				};
				splash.addEventListener('click', function () {
					minTime = 0;
					if (ready) hide();
				});
				setTimeout(
					function () {
						if (!ready) splash.classList.add('cp-wait');
					},
					seen ? 600 : minTime + 300
				);
			})();
		</script>
	</body>
</html>
